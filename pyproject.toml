[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "crisislens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "anthropic>=0.26.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "spacy>=3.7.0",
    "geopy>=2.4.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "plotly>=5.22.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
